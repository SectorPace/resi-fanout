name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Check
        working-directory: backend
        run: cargo check --locked
      - name: Test
        working-directory: backend
        run: cargo test --locked
      - name: Build release
        working-directory: backend
        run: cargo build --release

  version-sync:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match backend/Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match backend/Cargo.toml version $VER"
            exit 1
          fi
          echo "version in sync: v$TAG"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do
            bash -n "$f"
          done
      - name: Shellcheck
        run: |
          shellcheck -S warning install.sh uninstall.sh scripts/*.sh || true
