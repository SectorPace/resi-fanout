name: CI

on:
  push:
    branches: [main, 'v*']
    # `branches:` only ever matches refs/heads/*, so the version-sync job's
    # `startsWith(github.ref, 'refs/tags/v')` guard could not fire from a
    # branch filter alone. A `tags:` filter is what actually triggers on a
    # version tag push.
    # NOTE: these keys must sit at the same indent as `branches:` — nesting the
    # comment deeper made this file unparseable and failed every run.
    tags: ['v*']
  pull_request:

# Least privilege: this workflow only reads the repo. Previously it declared no
# permissions at all, so it inherited the repo/org default token scope (commonly
# read/write) while running on untrusted `pull_request` code.
permissions:
  contents: read

# Superseded runs are pointless work on every push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: backend
      - name: Check
        working-directory: backend
        run: cargo check --locked
      - name: Test
        working-directory: backend
        run: cargo test --locked
      - name: Build release
        working-directory: backend
        run: cargo build --release --locked

  version-sync:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag must match backend/Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match backend/Cargo.toml version $VER"
            exit 1
          fi
          echo "version in sync: v$TAG"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so the staleness gate below can ask whether the commit
      # that last touched frontend/src is an ancestor of the one that last
      # touched frontend/dist. A shallow clone cannot answer that.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      # install.sh falls back to the *committed* frontend/dist when npm is
      # unavailable (--no-frontend, or a failed toolchain install), so a stale
      # dist silently serves an old console to those installs instead of
      # failing loudly. This caught up when dist was last rebuilt two source
      # revisions behind. Deliberately compares commit topology rather than
      # diffing a fresh build against dist: vite's output is not guaranteed
      # byte-identical across Node versions, and a false failure here would
      # train everyone to ignore it.
      - name: Committed dist is not stale
        run: |
          src="$(git log -1 --format=%H -- frontend/src)"
          dst="$(git log -1 --format=%H -- frontend/dist)"
          if [ -z "$dst" ]; then
            echo "::error::frontend/dist is not committed at all"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$src" "$dst"; then
            echo "::error::frontend/dist is stale: $(git log -1 --format='%h %s' -- frontend/src) touched frontend/src after $(git log -1 --format='%h %s' -- frontend/dist) last rebuilt frontend/dist"
            echo "Run 'npm ci && npm run build' in frontend/ and commit the result."
            exit 1
          fi
          echo "dist is current with src ($(git log -1 --format=%h -- frontend/src))"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do
            bash -n "$f"
          done
      - name: Shellcheck
        run: |
          shellcheck -S warning install.sh uninstall.sh scripts/*.sh
      # scripts/xui_db.py writes directly to the 3x-ui panel SQLite database and
      # is invoked by the Rust backend, so a syntax error in it would break the
      # integration at runtime with nothing having caught it in CI.
      - name: Python syntax
        run: python3 -m py_compile scripts/xui_db.py
