name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches binary version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match backend/Cargo.toml version $VER"
            exit 1
          fi

      - name: Install cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        working-directory: backend
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          DIR="resi-fanout-${{ matrix.target }}"
          mkdir -p "$DIR/bin" "$DIR/web" "$DIR/scripts"
          cp "backend/target/${{ matrix.target }}/release/resi-fanout" "$DIR/bin/"
          cp -r frontend/dist/* "$DIR/web/"
          cp scripts/*.sh "$DIR/scripts/"
          cp scripts/xui_db.py "$DIR/scripts/"
          # keep both paths so install.sh finds it from either layout
          cp backend/config.example.json "$DIR/"
          mkdir -p "$DIR/backend" && cp backend/config.example.json "$DIR/backend/"
          cp install.sh uninstall.sh README.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" >> SHA256SUMS

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resi-fanout-*.tar.gz
            SHA256SUMS
