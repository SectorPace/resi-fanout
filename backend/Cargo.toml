[package]
name = "resi-fanout"
version = "1.0.6"
edition = "2021"
description = "Fetch free/residential proxies, health-check them, fan each one out to a local port, and hand the ports to 3x-ui as Xray outbounds."
license = "MIT"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1

[features]
default = ["tls-rustls", "tls"]
# default on Linux: pure-rust TLS, no system OpenSSL needed
tls-rustls = ["reqwest/rustls-tls"]
# handy on Windows dev boxes (Schannel), no C toolchain required
tls-native = ["reqwest/native-tls"]
# HTTPS support for the API/UI (ACME IP certificates). Disable with
# --no-default-features --features tls-native,tls if you only want plain HTTP
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
tower-http = { version = "0.5", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["gzip"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
